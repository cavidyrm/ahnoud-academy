server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Real 404s: unknown paths must NOT fall back to index.html, or crawlers
    # index every bad URL as a 200.
    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location = /robots.txt {
        expires 1h;
        add_header Cache-Control "public";
    }

    location = /sitemap.xml {
        expires 1h;
        add_header Cache-Control "public";
    }

    location = /site.webmanifest {
        types { } default_type application/manifest+json;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Fingerprint-free assets: moderate cache, revalidated weekly
    location ~* \.(svg|ico|png|jpe?g|webp|avif|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~* \.(js|jsx|css)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # HTML must revalidate so deploys are picked up immediately
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
}
